name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required GitHub secrets:
#   POSTGRES_DB           — test database name
#   POSTGRES_USER         — test database user
#   POSTGRES_PASSWORD     — test database password
#   GEMINI_API_KEY        — Google Gemini API key
#   AWS_ACCESS_KEY_ID     — AWS credentials (deploy job)
#   AWS_SECRET_ACCESS_KEY — AWS credentials (deploy job)
#
# Required GitHub variables (Settings → Secrets and variables → Variables):
#   AWS_REGION            — AWS region for all operations (e.g. us-east-1)
#   DEPLOY_ENV            — CDK context: dev | staging | prod  (default: dev)

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit -- --coverage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start test database
        run: docker compose -f test/docker-compose.yml up -d
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Wait for database to be healthy
        run: |
          for i in $(seq 1 12); do
            docker compose -f test/docker-compose.yml ps db | grep "healthy" && break
            echo "Waiting for DB... ($i/12)"
            sleep 5
          done

      - name: Integration tests
        run: npm run test:integration -- --forceExit
        env:
          DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Stop test database
        if: always()
        run: docker compose -f test/docker-compose.yml down
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  build:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t advisor-api:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        run: npx cdk deploy --context env=${{ vars.DEPLOY_ENV || 'dev' }} --require-approval never
        working-directory: infra

      - name: Get ECR URI from stack output
        id: ecr
        run: |
          ECR_REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name AdvisorStack-${{ vars.DEPLOY_ENV || 'dev' }} \
            --region ${{ vars.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" \
            --output text)
          echo "uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          ECR_REGISTRY=$(echo "${{ steps.ecr.outputs.uri }}" | cut -d'/' -f1)
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image to ECR
        run: |
          docker build -t "${{ steps.ecr.outputs.uri }}:latest" .
          docker push "${{ steps.ecr.outputs.uri }}:latest"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster ai-architecture-advisor-ecs-cluster \
            --service advisor-service \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for ECS service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ai-architecture-advisor-ecs-cluster \
            --services advisor-service \
            --region ${{ vars.AWS_REGION }}
